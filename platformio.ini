; ESP32-S3-WROOM-1-N16R8 handheld — PlatformIO project
; Board: Edgehax S3-PRO (N16R8: 16MB flash, 8MB octal PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8-specific: octal PSRAM + 16MB flash ---
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over native USB port, not just the UART bridge port

    ; --- LVGL: point EVERY compilation unit (incl. the LVGL library itself) at include/lv_conf.h.
    ;     Without the -I, PlatformIO only adds include/ for src/, so the lib misses our font/tick config. ---
    -DLV_CONF_INCLUDE_SIMPLE
    -I "${platformio.include_dir}"
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_UNSCII_8=1          ; blocky terminal font for data readouts

    ; --- TFT_eSPI config, built via build_flags instead of editing library internals ---
    ; ILI9341 240x320, SPI-A bus, pins per the wiring plan
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DUSE_HSPI_PORT=1   ; required when TFT pins fall in GPIO 10-13 on ESP32-S3
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=21
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl @ ^8.3.0                      ; UI framework — renders through TFT_eSPI (see include/lv_conf.h)
    bodmer/TFT_eSPI @ ^2.5.43              ; ILI9341 display (SPI-A)
    nrf24/RF24 @ ^1.4.11                    ; NRF24L01 modules (SPI-B)
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git  ; CC1101 sub-GHz (SPI-B) — not in PIO registry, GitHub direct
    adafruit/Adafruit PN532 @ ^1.3.4        ; NFC/RFID 13.56MHz (I2C)
    mikalhart/TinyGPSPlus @ ^1.1.0          ; GPS NMEA parsing (UART)
    adafruit/Adafruit MPU6050 @ ^2.2.6      ; GY-87 accel/gyro (I2C)
    adafruit/Adafruit Unified Sensor @ ^1.1.15  ; dependency of Adafruit MPU6050
    adafruit/Adafruit BusIO @ ^1.17.2       ; dependency of most Adafruit libs
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2  ; I2C GPIO expander
    adafruit/Adafruit MAX1704X @ ^1.0.3     ; MAX17048 fuel gauge (I2C)
    crankyoldgit/IRremoteESP8266 @ ^2.8.6   ; IR RX/TX, incl. 90+ AC protocols
    adafruit/Adafruit NeoPixel @ ^1.15.1    ; onboard WS2812B status LED

; Not added as libraries — handled directly, no dependency needed:
;   HC-05 Bluetooth      -> plain HardwareSerial, AT commands / passthrough
;   125kHz RFID R/W       -> plain HardwareSerial, module-specific byte protocol
;   MAX98357A I2S amp     -> ESP32 Arduino core's built-in I2S driver (driver/i2s.h)
